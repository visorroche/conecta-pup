name: Deploy production

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare ENV secret
        env:
          ENV_FILE: ${{ secrets.ENV }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "Secret ENV esta vazio. Cole o .env de producao em Settings > Secrets > ENV."
            exit 1
          fi
          echo "ENV_FILE_B64=$(printf '%s' "$ENV_FILE" | base64 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          ENV_FILE_B64: ${{ env.ENV_FILE_B64 }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          envs: ENV_FILE_B64,REPO_URL,BRANCH
          script: |
            set -euo pipefail
            export APP_DIR=/var/www/conecta-pup
            export DEBIAN_FRONTEND=noninteractive

            command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git curl; }

            mkdir -p /var/www
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            else
              git -C "$APP_DIR" fetch origin "$BRANCH"
              git -C "$APP_DIR" checkout "$BRANCH"
              git -C "$APP_DIR" reset --hard "origin/$BRANCH"
            fi

            umask 077
            printf '%s' "$ENV_FILE_B64" | base64 -d > "$APP_DIR/.env"
            chmod 600 "$APP_DIR/.env"

            bash "$APP_DIR/scripts/deploy.sh"
